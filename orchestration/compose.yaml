# Ecosistema MVP de la wallet (compatible con Docker Compose y Podman Compose).
# Uso: copiar .env.example a .env, completar las claves y ejecutar `podman compose up --build`.
name: kipu-wallet

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:?Define WALLET_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${WALLET_DB_PORT:-5432}:5432"
    volumes:
      - wallet-db:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      WALLET_DB_URL: jdbc:postgresql://db:5432/wallet
      WALLET_DB_USER: wallet
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      WALLET_DEMO_SEED: "true"
      WALLET_DEMO_PASSWORD: ${WALLET_DEMO_PASSWORD:?Define WALLET_DEMO_PASSWORD en .env}
      # Sin proveedor SMS: solo para demo, el codigo de verificacion se muestra en pantalla.
      WALLET_EXPOSE_DEMO_PHONE_CODE: "true"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WALLET_WEB_PORT:-8081}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  wallet-db:
